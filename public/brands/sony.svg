<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#040405" />
    </linearGradient>
    <linearGradient id="brandGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)" />
  <rect width="198" height="198" x="1" y="1" rx="43" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" />
  
  <!-- Subtle circular ambient glow -->
  <circle cx="100" cy="85" r="55" fill="url(#brandGlow)" />
  
  <!-- Stylized initial monogram -->
  <circle cx="100" cy="80" r="42" fill="#121215" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <text x="100" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle">S</text>

  <!-- Brand Wordmark text -->
  <text x="100" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#f4f4f5" text-anchor="middle" letter-spacing="0.5">Sony</text>
</svg>